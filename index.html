<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/utileria.js"></script>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>Crear cuenta</h1>

        <form id="formRegistro" novalidate>
          <div class="field">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Ej. Ana López" />
            <div class="hint">Solo letras y espacios</div>
            <div class="msg" id="msgNombre"></div>
          </div>

          <div class="field">
            <label for="correo">Correo electrónico</label>
            <input type="text" id="correo" placeholder="ejemplo@correo.com" />
            <div class="msg" id="msgCorreo"></div>
          </div>

          <div class="field">
            <label for="telefono">Teléfono (10 dígitos)</label>
            <input type="text" id="telefono" placeholder="5512345678" />
            <div class="msg" id="msgTelefono"></div>
          </div>

          <div class="field">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" />
            <button type="button" class="btn secondary" id="btnVerEdad">
              Ver mi edad
            </button>
            <div class="msg" id="msgFecha"></div>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Mín. 8 caracteres" />
            <div class="hint">
              Mayúscula, minúscula, número y carácter especial
            </div>
            <div class="msg" id="msgPassword"></div>
          </div>

          <button type="submit" class="btn">Registrarme</button>

          <div class="form-summary" id="resumen"></div>
        </form>

        <p class="nav-links">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </div>
    </div>

    <div class="overlay" id="overlayEdad">
      <div class="modal">
        <h2>Tu edad calculada</h2>
        <div class="edad-numero" id="modalEdadNumero">--</div>
        <div class="edad-estado" id="modalEdadEstado">Selecciona una fecha</div>
        <button type="button" class="btn" id="btnCerrarModal">Cerrar</button>
      </div>
    </div>
    <script>
      const inputNombre = document.getElementById("nombre");
      const inputCorreo = document.getElementById("correo");
      const inputTelefono = document.getElementById("telefono");
      const inputFecha = document.getElementById("fechaNacimiento");
      const inputPassword = document.getElementById("password");

      function actualizarCampo(input, elementoMsg, esValido, textoError, textoOk) {
        elementoMsg.classList.remove("show", "error", "ok");
        input.classList.remove("is-valid", "is-invalid");

        if (input.value.trim() === "") {
          return; 
        }

        if (esValido) {
          input.classList.add("is-valid");
          if (textoOk) {
            elementoMsg.textContent = textoOk;
            elementoMsg.classList.add("show", "ok");
          }
        } else {
          input.classList.add("is-invalid");
          elementoMsg.textContent = textoError;
          elementoMsg.classList.add("show", "error");
        }
      }

      inputNombre.addEventListener("input", () => {
        const valido = soloLetras(inputNombre.value);
        actualizarCampo(
          inputNombre,
          document.getElementById("msgNombre"),
          valido,
          "Usa solo letras y espacios (sin números ni símbolos).",
          `Se guardará como: ${capitalizarPalabras(inputNombre.value)}`
        );
      });

      inputCorreo.addEventListener("input", () => {
        const valido = validarCorreo(inputCorreo.value);
        actualizarCampo(
          inputCorreo,
          document.getElementById("msgCorreo"),
          valido,
          "Escribe un correo con formato usuario@dominio.com",
          "Correo con formato válido."
        );
      });

      inputTelefono.addEventListener("input", () => {
        const valido = validarLongitud(inputTelefono.value, 10) &&
          inputTelefono.value.replace(/\D/g, "").length === 10;
        const formateado = formatearTelefono(inputTelefono.value);
        actualizarCampo(
          inputTelefono,
          document.getElementById("msgTelefono"),
          valido,
          "El teléfono debe tener exactamente 10 dígitos.",
          formateado ? `Se guardará como: ${formateado}` : ""
        );
      });

      inputPassword.addEventListener("input", () => {
        const valido = validarPassword(inputPassword.value);
        actualizarCampo(
          inputPassword,
          document.getElementById("msgPassword"),
          valido,
          "Falta mayúscula, minúscula, número o carácter especial (mín. 8).",
          "Contraseña segura."
        );
      });

      const overlayEdad = document.getElementById("overlayEdad");
      const modalEdadNumero = document.getElementById("modalEdadNumero");
      const modalEdadEstado = document.getElementById("modalEdadEstado");
      const msgFecha = document.getElementById("msgFecha");

      function calcularYMostrarEdad() {
        if (!inputFecha.value) {
          msgFecha.textContent = "Selecciona una fecha de nacimiento primero.";
          msgFecha.classList.add("show", "error");
          return;
        }
        msgFecha.classList.remove("show", "error");

        const edad = calcularEdad(inputFecha.value);
        const mayorDeEdad = esMayorDeEdad(inputFecha.value);

        modalEdadNumero.textContent = isNaN(edad) ? "--" : edad;
        modalEdadEstado.textContent = mayorDeEdad
          ? "Eres mayor de edad."
          : "Eres menor de edad.";

        overlayEdad.classList.add("show");
      }

      document.getElementById("btnVerEdad").addEventListener("click", calcularYMostrarEdad);
      document.getElementById("btnCerrarModal").addEventListener("click", () => {
        overlayEdad.classList.remove("show");
      });
      overlayEdad.addEventListener("click", (evento) => {
        if (evento.target === overlayEdad) overlayEdad.classList.remove("show");
      });

      document.getElementById("formRegistro").addEventListener("submit", (evento) => {
        evento.preventDefault();

        const nombreValido = soloLetras(inputNombre.value);
        const correoValido = validarCorreo(inputCorreo.value);
        const telefonoValido =
          validarLongitud(inputTelefono.value, 10) &&
          inputTelefono.value.replace(/\D/g, "").length === 10;
        const fechaValida = !isNaN(calcularEdad(inputFecha.value));
        const passwordValida = validarPassword(inputPassword.value);

        inputNombre.dispatchEvent(new Event("input"));
        inputCorreo.dispatchEvent(new Event("input"));
        inputTelefono.dispatchEvent(new Event("input"));
        inputPassword.dispatchEvent(new Event("input"));

        const resumen = document.getElementById("resumen");
        resumen.classList.remove("show", "ok", "error");

        if (nombreValido && correoValido && telefonoValido && fechaValida && passwordValida) {
          const edad = calcularEdad(inputFecha.value);
          resumen.textContent = `Todo listo, ${capitalizarPalabras(inputNombre.value)}. Edad registrada: ${edad} años.`;
          resumen.classList.add("show", "ok");
        } else {
          if (!fechaValida) {
            msgFecha.textContent = "Selecciona una fecha de nacimiento válida.";
            msgFecha.classList.add("show", "error");
          }
          resumen.textContent = "Revisa los campos marcados en rojo antes de continuar.";
          resumen.classList.add("show", "error");
        }
      });
    </script>
  </body>
</html>
